version: 2

project_name: nhilens

before:
  hooks:
    - go mod verify
    - go vet ./...
    - go test -count=1 ./...

builds:
  - id: nhilens
    main: ./cmd/nhilens
    binary: nhilens
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/devel0mer/nhilens/internal/version.Version={{.Version}}
      - -X github.com/devel0mer/nhilens/internal/version.Commit={{.ShortCommit}}
      - -X github.com/devel0mer/nhilens/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: nhilens
    ids:
      - nhilens
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - docs/iam-policy.json
      - docs/nhilens.example.yaml
      - docs/nhilens-ignore.example.yaml
      - docs/rules.md

checksum:
  name_template: "checksums.txt"

# Keyless Cosign signing of checksums.txt via GitHub Actions OIDC (Sigstore Fulcio/Rekor).
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# Homebrew Tap (github.com/devel0mer/homebrew-tap).
# Automatically commits Formula/nhilens.rb when TAP_GITHUB_TOKEN is set in GitHub Actions secrets;
# otherwise generates the formula locally without failing the release.
brews:
  - name: nhilens
    directory: Formula
    repository:
      owner: devel0mer
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    skip_upload: "{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}"
    homepage: https://github.com/devel0mer/nhilens
    description: "Strictly read-only Go CLI to audit AWS non-human identities (NHI) and AI agents"
    license: Apache-2.0
    test: |
      assert_match "nhilens #{version}", shell_output("#{bin}/nhilens version")

# Scoop Bucket for Windows (github.com/devel0mer/scoop-bucket).
# Automatically commits bucket/nhilens.json when TAP_GITHUB_TOKEN is set in GitHub Actions secrets.
scoops:
  - name: nhilens
    directory: bucket
    repository:
      owner: devel0mer
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    skip_upload: "{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}"
    homepage: https://github.com/devel0mer/nhilens
    description: "Strictly read-only Go CLI to audit AWS non-human identities (NHI) and AI agents"
    license: Apache-2.0

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
