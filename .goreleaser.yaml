#     homepage: https://github.com/devel0mer/nhilens
#     description: "Read-only AWS non-human identity & AI agent auditor"
#     license: Apache-2.0
#     test: |
#       system "#{bin}/nhilens", "version"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
